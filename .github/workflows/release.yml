name: Release

# Veröffentlicht App und Firmware als GitHub-Release.
# Auslösen: Tag pushen, z.B.  git tag v0.4.0 && git push origin v0.4.0
# Die Firmware-Updates für die App veröffentlicht ein Admin danach in der App
# (Einstellungen → Dongle-Firmware → Neue Version veröffentlichen).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Plattform-Ordner erzeugen
        run: |
          flutter create --project-name dmx_control --org de.dmxcontrol --platforms=android .
          dart run tool/setup_platforms.dart
      - run: flutter pub get
      - run: flutter test
      - name: APK bauen
        run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk ../dmx-control-${GITHUB_REF_NAME}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dmx-control-*.apk

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - name: Kern-Tests
        run: make -C test/host
      - name: ESP32 bauen
        run: pio run
      - name: Dateien einsammeln
        run: |
          V=$(grep -E '#define FW_(MAJOR|MINOR|PATCH) ' include/board_config.h | awk '{print $3}' | paste -sd.)
          echo "Firmware $V"
          mkdir -p ../fw
          B=.pio/build/esp32dev
          cp $B/firmware.bin   ../fw/dmx-dongle-firmware-$V.bin
          cp $B/bootloader.bin ../fw/dmx-dongle-bootloader.bin
          cp $B/partitions.bin ../fw/dmx-dongle-partitions.bin
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin ../fw/dmx-dongle-boot_app0.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: fw/*

  release:
    needs: [apk, firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            **App:** `dmx-control-${{ github.ref_name }}.apk` aufs Handy laden und installieren.

            **Firmware per USB** (erstes Flashen oder Rettung), Adressen für esptool / Flash Download Tool:

            | Adresse | Datei |
            |---|---|
            | 0x1000  | dmx-dongle-bootloader.bin |
            | 0x8000  | dmx-dongle-partitions.bin |
            | 0xE000  | dmx-dongle-boot_app0.bin |
            | 0x10000 | dmx-dongle-firmware-*.bin |

            **Firmware über WLAN:** Danach reicht die `dmx-dongle-firmware-*.bin` allein, über die App
            (Einstellungen → Dongle-Firmware) oder die Setup-Seite des Dongles.
