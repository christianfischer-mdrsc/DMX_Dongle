name: Build

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform-Ordner erzeugen
        run: |
          flutter create --project-name dmx_control --org de.dmxcontrol --platforms=android .
          dart run tool/setup_platforms.dart

      - run: flutter pub get
      - run: flutter test
      - name: APK bauen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_KEY="$SUPABASE_KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: dmx-control-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - name: Kern-Tests
        run: make -C test/host
      - name: ESP32 bauen
        run: pio run
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: firmware/.pio/build/esp32dev/firmware.bin

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Schema einspielen (zweimal, prüft Wiederholbarkeit)
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/local_stub.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261024000000_licensing.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261024000000_licensing.sql
      - name: Datenbank-Tests
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/test_licensing.sql
