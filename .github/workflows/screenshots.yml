name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [tools/screenshots]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Schriften holen
        run: |
          mkdir -p fonts
          curl -sL -o fonts/Roboto.ttf "https://github.com/google/fonts/raw/main/ofl/roboto/Roboto%5Bwdth,wght%5D.ttf"
          cp "$(dirname $(which flutter))/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" fonts/
          ls -la fonts
      - run: flutter test screenshot_test --update-goldens
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/screenshot_test/shots/*.png
      - name: Bilder in den Branch legen
        if: github.ref == 'refs/heads/tools/screenshots'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f screenshot_test/shots/*.png
          git commit -m "Screenshots aktualisiert [skip ci]" || exit 0
          git push
