; DMX-Dongle Firmware – PlatformIO
; Bauen:    pio run
; Flashen:  pio run -t upload
; Monitor:  pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 115200
; Dieses Board: Flash antwortet dem esptool-Stub nicht (ID ff/ffff), ohne Stub geht es
upload_flags = --no-stub
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
build_unflags = -std=gnu++11
; dmxcore liegt in lib/ und wird automatisch mitgebaut.
