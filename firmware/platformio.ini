; DMX-Dongle Firmware – PlatformIO
; Bauen:    pio run
; Flashen:  pio run -t upload
; Monitor:  pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
build_unflags = -std=gnu++11
; dmxcore liegt in lib/ und wird automatisch mitgebaut.
